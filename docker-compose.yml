services:
  postgres:
    image: postgres:16
    container_name: conduit-realworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: database_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d database_development"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
